name: Collect and publish figure atlas
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 22 * * 0,3'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Discover 2025–2026 papers and extract reusable figure candidates'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: figure-atlas-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify catalog and pipeline
        run: python -m unittest discover -s tests -v
      - name: Install PDF extractor
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python -m pip install -r requirements.txt
      - name: Discover papers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python scripts/collect.py
      - name: Obtain reusable PDFs and extract candidates
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: python scripts/harvest.py --limit 20
      - name: Cache verified public images
        run: python scripts/cache_assets.py
      - name: Validate refreshed catalog
        run: python -m unittest discover -s tests -v
      - name: Save collection progress
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper index and figure candidates'
            git push origin HEAD:main
          fi
      - name: Build public website
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
